name: Java CI
on:
    push:
        branches: ["main", "feature/**"]
        paths:
            - "cinema-tickets-java/**"
            - ".github/workflows/java-ci.yml"

    pull_request:
        branches: ["main"]
        paths:
            - "cinema-tickets-java/**"
            - ".github/workflows/java-ci.yml"

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: cinema-tickets-java

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"
                  cache-dependency-path: "cinema-tickets-java/pom.xml"

            - name: Build with Maven
              run: mvn --batch-mode clean verify
